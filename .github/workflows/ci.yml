name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  demo-build:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork && vars.VAULTSORT_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        with:
          enablement: false
      - name: Build marked demo from verified source
        env:
          VITE_HOSTED_DEMO: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${PAGES_BASE_PATH}/"
      - name: Reject symlinks before artifact packaging
        run: test -z "$(find dist -type l -print -quit)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: dist

  deploy:
    needs: [verify, demo-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.fork && vars.VAULTSORT_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # All publishers must share this lock. Forward-only main; rollback via a new revert commit.
    concurrency:
      group: vaultsort-pages-publication
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check current main inside publication lock
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          // # freshness-start
            const { appendFileSync } = require('node:fs')
            async function main() {
              const env = process.env
              const response = await fetch(`${env.GITHUB_API_URL}/repos/${env.REPOSITORY}/git/ref/heads/main`, {
                headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(30000),
              })
              if (!response.ok) throw new Error('Ref unavailable')
              const ref = await response.json()
              if (ref?.ref !== 'refs/heads/main' || ref?.object?.type !== 'commit' || typeof ref.object.sha !== 'string' || !/^[a-f0-9]{40}$/.test(ref.object.sha) || !/^[a-f0-9]{40}$/.test(env.SOURCE_SHA ?? '')) throw new Error('Invalid ref')
              const fresh = ref.object.sha === env.SOURCE_SHA
              appendFileSync(env.GITHUB_OUTPUT, `fresh=${fresh}\n`)
              if (!fresh) appendFileSync(env.GITHUB_STEP_SUMMARY, 'Pages publication skipped: stale revision; main has advanced.\n')
            }
            main().catch(() => { console.error('Current-main check failed; publication blocked.'); process.exitCode = 1 })
          // # freshness-end
          NODE
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        if: steps.freshness.outputs.fresh == 'true'
        with:
          artifact_name: github-pages
